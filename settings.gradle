pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'minimap-shapes-suite'
include('core-fabric', 'core-neoforge',
        'journeymap-fabric', 'journeymap-neoforge',
        'xaero-fabric', 'xaero-neoforge')
project(':core-fabric').projectDir = file('core/fabric')
project(':core-neoforge').projectDir = file('core/neoforge')
project(':journeymap-fabric').projectDir = file('journeymap/fabric')
project(':journeymap-neoforge').projectDir = file('journeymap/neoforge')
project(':xaero-fabric').projectDir = file('xaero/fabric')
project(':xaero-neoforge').projectDir = file('xaero/neoforge')
